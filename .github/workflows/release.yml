name: Release

# Build a standalone .exe and publish it to a GitHub Release whenever a
# version tag (e.g. v1.0.0) is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the release and upload the asset

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish single-file exe
        run: dotnet publish WorldWatch.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/net10.0-windows/win-x64/publish/WorldWatch.exe
          generate_release_notes: true
